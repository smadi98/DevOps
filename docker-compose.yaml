services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api-container-compose
    ports:
      - "8080:8080"

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend-container-compose
    ports:
      - '8081:8081'
    depends_on:
     - backend

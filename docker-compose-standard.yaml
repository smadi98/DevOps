services:
  backend:
    image: python:3.9-alpine3.12
    container_name: api-container-compose
    working_dir: /app/api
    volumes:
      - ./api:/app/api
    command: >
      sh -c "
        apk add --no-cache redis &&
        pip install --upgrade pip &&
        pip install -r requirements.txt --root-user-action=ignore &&
        redis-server --daemonize yes &&
        python main.py
      "
    ports:
      - "8080:8080"

  frontend:
    image: python:3.9-alpine3.12
    container_name: frontend-container-compose
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: >
      sh -c "
        pip install --upgrade pip &&
        pip install -r requirements.txt && 
        python main.py
      "
    ports:
      - '8081:8081'
    depends_on:
     - backend